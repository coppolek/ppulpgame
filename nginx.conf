# ==============================================================================
# Nginx Configuration for puulp.it (VPS Deployment)
# Copy this file to /etc/nginx/sites-available/puulp.it
# And enable it: sudo ln -s /etc/nginx/sites-available/puulp.it /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
# ==============================================================================

# HTTP: Redirect all traffic to HTTPS (puulp.it)
server {
    listen 80;
    listen [::]:80;
    server_name puulp.it www.puulp.it;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://puulp.it$request_uri;
    }
}

# HTTPS: Main Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.puulp.it;

    # SSL Certificates (managed by Certbot: sudo certbot --nginx -d puulp.it -d www.puulp.it)
    ssl_certificate /etc/letsencrypt/live/puulp.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puulp.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to apex domain
    return 301 https://puulp.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name puulp.it;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/puulp.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puulp.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory on your VPS (after running `npm run build`)
    root /var/www/puulp.it/dist;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security & Performance Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache Control for Static Vite Assets (immutable cache 1 year)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache Control for JSON data files (1 hour)
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # SPA Routing: Fallback to index.html for React router / query parameters
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If you run with Node.js / PM2 backend (reverse proxy mode)
    # Uncomment this block if running `npm start` on port 3000:
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Custom 404 handler
    error_page 404 /index.html;

    # Logging
    access_log /var/log/nginx/puulp.it.access.log;
    error_log /var/log/nginx/puulp.it.error.log warn;
}
