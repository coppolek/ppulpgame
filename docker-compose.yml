version: '3.8'

services:
  puulp:
    image: node:20-alpine
    container_name: puulp-app
    restart: always
    ports:
      - "3001:3001"
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
    command: >
      sh -c "npm install -g serve &&
             wget --no-check-certificate -O puulp-dist.tar.gz https://ais-pre-zfg2u7sujutswwp5vu24f5-132736654569.europe-west3.run.app/puulp-dist.tar.gz &&
             mkdir -p dist &&
             tar -xzf puulp-dist.tar.gz -C dist &&
             serve -s dist -l 3001"
